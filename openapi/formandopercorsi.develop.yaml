              description: 'The first name of the client. It is used only if the client is not a company and it is not present the id of the client'
              type: string
              example: John
            last_name:
              description: 'The last name of the client. It is used only if the client is not a company and it is not present the id of the client'
              type: string
              example: Doe
            company_name:
              description: 'The company name of the client. It is used only if the client is a company and it is not present the id of the client'
              type: string
              example: ACME
            street_name:
              description: 'The street name of the client'
              type: string
              example: Main
            street_number:
              description: 'The street number of the client'
              type: string
              example: '123'
            zip:
              description: 'The zip code of the client'
              type: string
              example: '12345'
            city:
              description: 'The city of the client'
              type: string
              example: Ferrara
            province:
              description: 'The province of the client'
              type: string
              example: FE
            vat_number:
              description: 'The VAT number of the client'
              type: string
              example: '12345678901'
            cf:
              description: 'The fiscal id of the client'
              type: string
              example: GRMFPC87G13G968P
          type: object
        order_id:
          description: 'The order ID'
          type: integer
          example: 3
        number:
          description: 'The invoice number'
          type: string
          example: FPC/123
        uuid:
          description: 'The invoice UUID'
          type: string
          example: d3b3e3e3-3e3e-3e3e-3e3e-3e3e3e3e3e3e
        status:
          description: 'The invoice status'
          type: string
          enum:
            - pending
            - sent
            - quarantena
            - accepted
            - rejected
            - notdelivered
          example: pending
        subtotal:
          description: 'The invoice subtotal'
          type: number
          example: 100
        document_type:
          description: 'document type. TD01 for invoice, TD04 for credit note'
          type: string
          enum:
            - TDO1
            - TD04
          example: TD01
        created_at:
          description: 'The invoice creation date'
          type: string
          format: date-time
          example: '2021-01-01T00:00:00+00:00'
        status_message:
          description: 'Messages associated to the state of the invoice. It could be null. This field is used to provide more context about the invoice status, particularly in case of errors.'
