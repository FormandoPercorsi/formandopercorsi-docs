    TrackingMetricDefinition:
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: events_total
        name:
          type: string
          example: 'Total Events'
        description:
          type: string
          example: 'Total number of tracked events'
          nullable: true
        metric_type:
          description: "Type of metric: 'primitive' performs basic aggregation on raw events, 'composite' combines other metrics using expressions"
          type: string
          enum:
            - primitive
            - composite
        primitive_type:
          description: "Aggregation operation for primitive metrics. Options: count_events (count matching events), distinct_sessions (count unique sessions), distinct_users (count unique users), count_anonymous_events (count events without user_id), count_authenticated_events (count events with user_id), sum_numeric_field (sum values from a field), count_distinct_values (count unique field values), min_numeric_field (find minimum field value), max_numeric_field (find maximum field value). Required when metric_type='primitive'."
          type: string
          enum:
            - count_events
            - distinct_sessions
            - distinct_users
            - count_anonymous_events
            - count_authenticated_events
            - sum_numeric_field
            - count_distinct_values
            - min_numeric_field
            - max_numeric_field
          nullable: true
        result_type:
          type: string
          enum:
            - number
            - json
        parameters:
          description: 'Configuration parameters for the metric calculation. Structure depends on primitive_type: for sum_numeric_field/count_distinct_values/min_numeric_field/max_numeric_field requires {"field": "path.to.field"} where field uses dot notation to access nested event properties (e.g., "payload.amount", "data.product_id"). Not required for count_events, distinct_sessions, distinct_users, count_anonymous_events, count_authenticated_events.'
          type: object
          example: '{"field": "payload.amount"}'
          nullable: true
        expression:
          description: "Expression for composite metrics (e.g., 'metric_a / metric_b')"
          type: string
          example: 'conversions / sessions * 100'
          nullable: true
        is_active:
          type: boolean
          example: true
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TrackingMetricRule'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    TrackingMetricResult:
      properties:
        id:
          type: integer
          example: 1
        metric_definition_id:
          type: integer
          example: 1
        metric_code:
          type: string
          example: events_total
        metric_name:
          type: string
          example: 'Total Events'
        date:
          type: string
          format: date
