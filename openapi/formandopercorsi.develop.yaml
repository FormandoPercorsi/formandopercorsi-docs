                example: ERR123
              error_description:
                description: 'A detailed description of the error or status message.'
                type: string
                example: 'The invoice could not be delivered due to a network issue.'
              error_hint:
                description: 'A hint or suggestion for resolving the issue described in the error message.'
                type: string
                example: 'Please check your network connection and try again.'
            type: object
