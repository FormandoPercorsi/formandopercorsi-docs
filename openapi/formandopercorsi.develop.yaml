          nullable: true
        date:
          description: 'Date of the invoice. If not set, the current date will be used.'
          type: string
          format: Y-m-d
          example: '2021-01-01'
          nullable: true
      type: object
    AvailableBookingOptionsForm:
      description: 'Available booking options form allows to get available booking options (teachers, subjects, trainings, lengths, locations) for a student with various filters.'
      required: []
      properties:
        lessons_for_week:
          description: 'Lessons per week'
          type: integer
          example: 1
        modifying_lesson_id:
          description: 'Modifying Lesson ID. If set, the availabilities of the lesson being modified are temporarily restored to allow rebooking in the same slots.'
          type: integer
          example: 1
        excluded_teachers_id:
          description: 'Array of Excluded Teacher IDs. These teachers will be excluded from the search results.'
          type: array
          items:
            type: integer
          example:
            - 1
            - 2
            - 3
      type: object
    AvailableLengthsForm:
      description: "Available lengths form allows to get available length for a lesson. It requires to specify the student and the subject of the lesson and allows to specify the teacher. If the teacher is not specified, the system will search for all teachers teaching the student's school and class. In addition, the parameter lesson_kind can be set to specify if you are searching for a training or a single lesson. Default is single lesson. The system will return the available lengths for the lesson."
      required:
        - student_id
        - subject_id
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableSubjectsForm'
        -
          properties:
            subject_id:
              description: 'Subject ID'
              type: integer
              example: 1
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    AvailableLocationsForm:
      description: 'Available locations form allows to get available locations for a lesson.'
      required:
        - student_id
        - subject_id
        - length
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableLengthsForm'
        -
          properties:
            length:
              description: 'Lesson length in hours.'
              type: integer
              example: 1
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    AvailableSonsForm:
      description: 'Available sons form allows to get available sons to book a lesson or a training.'
      required: []
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableTrainingsForm'
        -
          properties:
            training_id:
              description: 'Training ID'
              type: integer
              example: 1
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    AvailableSubjectsForm:
      description: 'Available subjects form allows to get available subjects for a student.'
      required:
        - student_id
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableSonsForm'
        -
          properties:
            student_id:
              description: 'Student ID'
              type: integer
              example: 1
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    AvailableTeachersForm:
      title: AvailableTeachersForm
      description: 'Available teachers form allows to get available teachers for a student.'
      required:
        - student_id
        - subject_id
        - length
        - location
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableLocationsForm'
        -
          properties:
            location:
              description: 'Location to filter available teachers.'
              type: string
              enum:
                - home
                - online
                - headquarter
              example: online
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    AvailableTrainingsForm:
      title: AvailableTrainingsForm
      description: 'Available trainings form allows to get available trainings buyable for an user.'
      required: []
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    CreateSingleLessonForm:
      description: 'CreateSingleLessonForm is the model behind the booking of a new single lesson.'
      required:
        - start_date_time
        - location
        - subject_id
        - student_id
        - size
      properties:
        start_date_time:
          description: 'Start date and time of the lesson'
          type: string
          format: 'Y-m-d H:i:s'
          example: '2022-01-01 10:00:00'
        location:
          description: 'Location of the lesson'
          type: string
          enum:
            - online
            - home
            - headquarter
          example: home
        subject_id:
          description: 'ID of the subject of the lesson'
          type: integer
          example: 1
        teacher_id:
          description: 'ID of the teacher of the lesson'
          type: integer
          example: 13
        student_id:
          description: 'ID of the student of the lesson'
          type: integer
          example: 45
        size:
          description: 'Size of the lesson'
          type: number
          format: float
          example: 1.5
        promotional_code:
          description: 'Promotional code applied to the lesson (if any)'
          type: string
          example: NEWYEAR2022
          nullable: true
        insurance:
          description: 'Whether to add cancellation/modification insurance to this booking. Not allowed for free lessons (with a promotional code that makes the amount 0): validation will fail with a 400 error.'
          type: boolean
          default: false
          example: false
      type: object
    CreateTrainingForm:
      title: CreateTrainingForm
      description: 'Create a training lesson'
      required:
        - location
        - teacher_id
        - student_id
        - size
        - lessons
        - training_type_id
      properties:
        location:
          description: 'Location of the lesson'
          type: string
          enum:
            - online
            - home
            - headquarter
          example: home
        teacher_id:
          description: 'ID of the teacher of the lesson'
          type: integer
          example: 13
        student_id:
          description: 'ID of the student of the lesson'
          type: integer
          example: 14
        size:
          description: 'Size of the lesson'
          type: number
          format: float
          example: 1.5
        training_type_id:
          description: 'ID of the training type'
          type: integer
          example: 1
        lessons:
          description: 'Array of lessons'
          type: array
          items:
            properties:
              subject_id:
                type: integer
                example: 123
              start_date_time:
                type: string
                format: date-time
                example: '2022-01-01 10:00:00'
            type: object
        insurance:
          description: 'Whether to add cancellation/modification insurance to this booking'
          type: boolean
          default: false
          example: false
      type: object
    DeleteSingleLessonForm:
      title: DeleteSingleLessonForm
      description: 'Form for delete single lesson'
      properties:
        lesson_id:
          description: 'Lesson id'
          type: integer
          example: 1
        reason:
          description: 'Reason for deleting the lesson'
          type: string
          example: 'I need to cancel this lesson due to personal reasons.'
        delete_availability:
          description: 'Flag to indicate if availability correspondent to the lesson should be deleted (only if a teacher deletes the lesson)'
          type: boolean
          default: false
          example: false
      type: object
    FamilyLessonForm:
      title: FamilyLessonForm
      description: "Form to allow teachers to search student's lessons."
      properties:
        start_date:
          description: 'Start date.'
          type: string
          format: Y-m-d
          default: 'today date'
          example: '2021-01-01'
          nullable: true
        end_date:
          description: 'End date. If it is not provided, end_date is set one years from now.'
          type: string
          format: Y-m-d
          example: '2021-01-01'
          nullable: true
        student_id:
          description: 'Student user id. One between student_id and modifing_lesson_id must be provided.'
          type: integer
          example: 1
          nullable: true
        modifing_lesson_id:
          description: 'Lesson id to be modified. One between student_id and modifing_lesson_id must be provided.'
          type: integer
          example: 1
          nullable: true
      type: object
    LessonModificationResponseForm:
      description: 'LessonModificationResponseForm is the model behind the response to a lesson modification request.'
      required:
        - lesson_modification_request_id
      properties:
        lesson_modification_request_id:
          description: 'ID of the lesson modification request'
          type: integer
          example: 12345
      type: object
    LessonPriceForm:
      description: 'Form for querying lesson prices, optionally filtered by length and promotional code.'
      properties:
        length:
          description: 'Length of the lesson in hours. If omitted, prices for all available lengths are returned.'
          type: number
          format: float
          example: 1.5
          nullable: true
        promotional_code:
          description: 'Promotional code to apply to lesson prices when valid for the logged user'
          type: string
          example: WELCOME10
          nullable: true
      type: object
    LessonSearchForm:
      title: LessonSearchForm
      description: 'Lesson search form. Sorting options: id, date, status, creation_date.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/BaseRecordSearchForm'
        -
          properties:
            teacher_ids:
              description: 'Filter by teacher IDs.'
              type: array
              items:
                type: integer
              example:
                - 1
                - 2
                - 3
            student_ids:
              description: 'Filter by student IDs.'
              type: array
              items:
                type: integer
              example:
                - 4
                - 5
                - 6
            provider_ids:
              description: 'Filter by provider IDs.'
              type: array
              items:
                type: integer
              example:
                - 7
                - 8
            status:
              description: 'Filter by lesson status.'
              type: array
              items:
                type: string
                enum:
                  - booked
                  - paid
                  - booked_pay_after
                  - deleted
                  - placeholder
                  - modify_request
                  - transferred
                  - deleted_by_teacher
                  - free_teacher_paid
              example:
                - paid
                - transferred
            locations:
              description: 'Filter by lesson locations.'
              type: array
              items:
                type: string
                enum:
                  - online
                  - home
                  - headquarter
              example:
                - online
                - home
            student_city_ids:
              description: 'Filter by student city IDs.'
              type: array
              items:
                type: integer
              example:
                - 10
                - 20
            teacher_city_ids:
              description: 'Filter by teacher city IDs.'
              type: array
              items:
                type: integer
              example:
                - 30
                - 40
            lengths:
              description: 'Filter by lesson lengths (in hours).'
              type: array
              items:
                type: number
                enum:
                  - 1
                  - 1.5
                  - 2
              example:
                - 1
                - 1.5
            start_date:
              description: 'Deprecated. Use start_date_time instead. Filter by start date (YYYY-MM-DD).'
              type: string
              format: date
              example: '2024-01-01'
              deprecated: true
            end_date:
              description: 'Deprecated. Use end_date_time instead. Filter by end date (YYYY-MM-DD).'
              type: string
              format: date
              example: '2024-12-31'
              deprecated: true
          type: object
    ModifySingleLessonForm:
