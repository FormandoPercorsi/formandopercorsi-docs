                  description: 'Online location warning time.'
                  type: number
                  format: float
                  example: 0.5
              type: object
            home:
              description: 'Home location.'
              properties:
                enabled:
                  description: 'Home location enabled.'
                  type: boolean
                  example: false
                warning_time:
                  description: 'Home location warning time.'
                  type: number
                  format: float
                  example: 0.5
              type: object
            headquarter:
              description: 'Headquarter location.'
              properties:
                enabled:
                  description: 'Headquarter location enabled.'
                  type: boolean
                  example: false
                warning_time:
                  description: 'Headquarter location warning time.'
                  type: number
                  format: float
                  example: 0.5
              type: object
