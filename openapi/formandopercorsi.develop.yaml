  /api/subtopic:
    get:
      tags:
        - Subtopic
      summary: 'List subtopics'
      description: 'Returns a paginated list of subtopics. Supports filtering by name (partial match) and by parent topic. Public endpoint: no authentication required.'
      operationId: 198c667b14ba3f98262d11e0c1229658
      parameters:
        -
          name: page
          in: query
          description: 'Page number (starting from 1)'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: page_size
          in: query
          description: 'Number of results per page'
          required: false
          schema:
            type: integer
            default: 10
        -
          name: sort_by
          in: query
          description: 'Field to sort results by'
          required: false
          schema:
            type: string
            default: name
            enum:
              - id
              - name
              - created_at
        -
          name: sort_order
          in: query
          description: 'Sort direction'
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
        -
          name: name
          in: query
          description: 'Filter by subtopic name (partial match, case-insensitive)'
          required: false
          schema:
            type: string
        -
          name: topic_id
          in: query
          description: 'Filter subtopics belonging to a specific parent topic'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Paginated list of subtopics'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  items: { type: array, items: { $ref: '#/components/schemas/SubtopicDto' } }
                type: object
        '400':
          description: 'Invalid search parameters'
    post:
      tags:
        - Subtopic
      summary: 'Create subtopic'
      description: 'Creates a new subtopic and associates it with an existing topic. Requires a unique name and the parent topic ID. Admin only.'
      operationId: 85c34b7f67836591d24e3089e3f6f1d2
      requestBody:
        description: 'Subtopic data'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubtopicForm'
      responses:
        '201':
          description: 'Subtopic created successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: created }
                  data: { $ref: '#/components/schemas/SubtopicDto' }
                type: object
        '400':
          description: 'Validation error (e.g. duplicate name or non-existent topic)'
        '401':
          description: 'Missing or invalid JWT token'
        '403':
          description: 'User does not have admin privileges'
      security:
        -
          bearerAuth: []
  '/api/subtopic/{id}':
    get:
      tags:
        - Subtopic
      summary: 'View subtopic'
      description: 'Returns details of a single subtopic by its ID. Public endpoint.'
      operationId: 30250b0cc81ab1dff7e810c0a9a0f2f6
      parameters:
        -
          name: id
          in: path
          description: 'Subtopic ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Subtopic details'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                  data: { $ref: '#/components/schemas/SubtopicDto' }
                type: object
        '404':
          description: 'Subtopic not found'
    delete:
      tags:
        - Subtopic
      summary: 'Delete subtopic'
      description: 'Performs a soft-delete of the subtopic. The record is not removed from the database but marked as deleted. Admin only.'
      operationId: 4cc8d3ae891ffe1198bbe4787c42a8b1
      parameters:
        -
          name: id
          in: path
          description: 'Subtopic ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Subtopic deleted successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                  message: { type: string, example: 'Subtopic deleted successfully' }
                type: object
        '401':
          description: 'Missing or invalid JWT token'
        '403':
          description: 'User does not have admin privileges'
        '404':
          description: 'Subtopic not found'
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Subtopic
      summary: 'Update subtopic'
      description: 'Updates fields of an existing subtopic. All fields are optional: only those provided are modified. The subtopic can be moved under a different topic by changing topic_id. Admin only.'
      operationId: 00a1d8522baef5cd9b8643c54c7367f2
      parameters:
        -
          name: id
          in: path
          description: 'Subtopic ID'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Fields to update (only provided fields will be modified)'
