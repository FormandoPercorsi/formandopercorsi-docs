          nullable: true
        value_num:
          type: number
          example: 1234.5
        value_json:
          type: object
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    TrackingMetricRule:
      properties:
        id:
          type: integer
          example: 1
