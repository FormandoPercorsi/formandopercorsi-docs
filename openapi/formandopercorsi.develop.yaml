          schema:
            type: string
            example: image/jpeg
      responses:
        '200':
          description: 'Presigned upload URL for thumbnail'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                  upload_url: { type: string, example: 'https://s3.amazonaws.com/...' }
                  path: { type: string, example: videos/thumbnails/intro.jpg }
                  supports_presigned: { type: boolean, example: true }
                type: object
        '404':
          description: 'Video not found'
        '422':
          description: 'Video has no thumbnail path set'
      security:
        -
          bearerAuth: []
  '/api/video/{id}/thumbnail-download-url':
    get:
      tags:
        - Video
      summary: 'Get a presigned URL to download/view the video thumbnail (admin only)'
      operationId: 9ab27722eaa285ac822c3609b6b0af85
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Presigned download URL for thumbnail'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok }
                  download_url: { type: string, example: 'https://s3.amazonaws.com/...' }
                  supports_presigned: { type: boolean, example: true }
                type: object
        '404':
          description: 'Video not found'
        '422':
          description: 'Video has no thumbnail path set'
      security:
        -
          bearerAuth: []
components:
  schemas:
    BaseStatisticsSearch:
      properties:
        start_date_time:
          description: 'Start datetime (Y-m-d H:i:s, Europe/Rome)'
          type: string
          format: date-time
          example: '2025-09-01 00:00:00'
        end_date_time:
          description: 'End datetime (Y-m-d H:i:s, Europe/Rome)'
          type: string
          format: date-time
          example: '2025-09-30 23:59:59'
        subjects_id:
          type: array
          items:
            type: integer
        schools_id:
          type: array
          items:
            type: integer
        cities_id:
          type: array
          items:
            type: integer
        provinces_id:
          type: array
          items:
            type: integer
        granularity:
          type: string
          enum:
            - day
            - week
            - month
            - year
        group_by:
          type: string
          enum:
            - teacher
            - subject
            - school
            - city
            - province
            - year
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        sort_by:
          description: "Field to sort by: 'period', 'group_id', 'group_key', or any measure name (primitive or derived). Defaults to 'period'."
          type: string
        sort_order:
          type: string
          enum:
            - asc
            - desc
        export:
          type: string
          enum:
            - csv
            - xlsx
            - json
      type: object
    TeacherToken:
      properties:
        id:
          description: 'This is the model class for table "profs_token".'
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: teacher@example.com
        token:
          type: string
          example: random_generated_token
        teacher_application_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: 'Y-m-d H:i:s'
          example: '2023-01-01 00:00:00'
        used_at:
          type: string
          format: 'Y-m-d H:i:s'
          example: '2023-01-01 00:00:00'
        deleted_at:
          type: string
          format: 'Y-m-d H:i:s'
          example: '2023-01-01 00:00:00'
        teacher:
          oneOf:
            -
              $ref: '#/components/schemas/User'
          nullable: true
      type: object
    AvailabilityCalendarFamilyForm:
      title: AvailableCalendarFamilyForm
      description: 'Available calendar family form allows to get the calendar of availabilities to book a lesson or a training.'
      required:
        - student_id
        - subject_id
        - length
        - location
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableTeachersForm'
        -
          properties:
            teacher_id:
              description: 'Optional Teacher ID to filter availabilities for a specific teacher. If not provided, availabilities for all suitable teachers will be returned.'
              type: integer
              example: 2
            searched_lesson_length:
              description: "Deprecated: Use 'length' instead. The length of the lesson to search for, in hours. E.g., 1 for a 1-hour lesson, 1.5 for a 1.5-hour lesson."
              type: number
              example: 3
              deprecated: true
            excluded_teacher_ids:
              description: "Deprecated: Use 'excluded_teachers_id' instead. An array of Teacher IDs to exclude from the search results."
              type: array
              items:
                type: integer
              example:
                - 3
                - 5
                - 7
              deprecated: true
            selected_lessons:
              description: 'An array of Lesson start and end date times. The endpoint will filter teachers that are available for all the selected lessons.'
              type: array
              items:
                properties:
                  start_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 10:00:00' }
                  end_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 11:00:00' }
                type: object
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    CreateAvailabilityForm:
      description: 'Create Availability Form'
      required:
        - start_date_time
        - end_date_time
      properties:
        start_date_time:
          description: 'Start Date and time. MUST be in a quarter of an hour.'
          type: string
          format: 'Y-m-d H:i:s'
          example: '2022-01-01 00:00:00'
        end_date_time:
          description: 'End Date and time. Must be in a quarter of an hour. '
          type: string
          format: 'Y-m-d H:i:s'
          example: '2022-01-02 00:00:00'
        recurrency:
          $ref: '#/components/schemas/Recurrence'
        locations:
          $ref: '#/components/schemas/Locations'
        only_consecutive_lessons:
          description: 'Only consecutive lessons are allowed. If it is set to true, the first lesson booked on the availability can be booked at any time, but the following lessons must be booked consecutively. It means that if for example the availability is from 15:00 to 18:00 and a lesson is booked from 15:00 to 16:00, next lesson can be booked only from 16:00. If it is set to false, the student can book any lesson at any time.'
          type: boolean
          default: false
          example: false
      type: object
    SearchAvailabilityFamilyForm:
      description: 'Availability search form for families.'
      required:
        - student_id
        - location
        - selected_lessons
      type: object
      allOf:
        -
          $ref: '#/components/schemas/AvailableTeachersForm'
        -
          properties:
            teacher_id:
              description: 'Optional Teacher ID to filter availabilities for a specific teacher. If not provided, availabilities for all suitable teachers will be returned.'
              type: integer
              example: 2
            searched_lesson_length:
              description: "Deprecated: Use 'length' instead. The length of the lesson to search for, in hours. E.g., 1 for a 1-hour lesson, 1.5 for a 1.5-hour lesson."
              type: integer
              example: 3
              deprecated: true
            excluded_teacher_ids:
              description: "Deprecated: Use 'excluded_teachers_id' instead. An array of Teacher IDs to exclude from the search results."
              type: array
              items:
                type: integer
              example:
                - 3
                - 5
                - 7
              deprecated: true
            selected_lessons:
              description: 'An array of Lesson start and end date times. The endpoint will filter teachers that are available for all the selected lessons.'
              type: array
              items:
                properties:
                  start_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 10:00:00' }
                  end_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 11:00:00' }
                type: object
            required_lessons:
              description: "Deprecated: Use 'selected_lessons' instead. An array of Lesson start and end date times. The endpoint will filter teachers that are available for all the required lessons."
              type: array
              items:
                properties:
                  start_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 10:00:00' }
                  end_date_time: { type: string, format: 'Y-m-d H:i:s', example: '2024-10-01 11:00:00' }
                type: object
              deprecated: true
            page:
              description: 'The page number for paginated results. Default is 1.'
              type: integer
              default: 1
              example: 1
            page_size:
              description: 'The number of teachers per page for paginated results. Default is 5.'
              type: integer
              default: 5
              example: 5
          type: object
        -
          $ref: '#/components/schemas/AvailableBookingOptionsForm'
    SearchAvailabilityTeacherAdminForm:
      title: SearchAvailabilityTeacherAdminForm
      description: 'Teachers and admins search availability form. Sorting options: id, date, status, teacher_id.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/BaseRecordSearchForm'
        -
          properties:
            teacher_ids:
              description: 'List of teacher IDs to filter by.'
              type: array
              example:
                - 1
                - 2
                - 3
            subject_ids:
              description: 'List of subject IDs to filter by.'
              type: array
              example:
                - 1
                - 2
                - 3
            school_ids:
              description: 'List of school IDs to filter by.'
              type: array
              example:
                - 1
                - 2
                - 3
            school_classes:
              description: 'List of school classes to filter by.'
              type: array
              items:
                type: integer
                enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
              example:
                - 1
                - 2
                - 3
            status:
              description: 'Availability status to filter by.'
              type: array
              enum:
                - pending
                - processed
                - deleted
                - failed
              example:
                - processed
                - pending
