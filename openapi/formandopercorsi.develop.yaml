    UpdateAvailabilityForm:
      description: 'Update Availability Form'
      required:
        - id
        - start_date_time
        - end_date_time
        - locations
      properties:
        update_group:
          description: 'If update_group is true, the availability will be updated for the entire group. If update_group is false, the availability will be updated only for the selected availability and the availability is removed from the group.'
          type: boolean
          default: false
          example: true
        start_date_time:
          description: 'Start Date and time. MUST be in a quarter of an hour.'
          type: string
          format: 'Y-m-d H:i:s'
          example: '2022-01-01 00:00:00'
        end_date_time:
          description: 'End Date and time. Must be in a quarter of an hour. '
          type: string
          format: 'Y-m-d H:i:s'
          example: '2022-01-02 00:00:00'
        recurrency:
          description: Recurrency
          properties:
            type:
              description: 'Recurrency type'
              type: string
              enum:
                - daily
                - weekly
                - monthly
              example: monthly
            end_date:
              description: 'Recurrency end date'
              type: string
              format: date
              example: '2022-01-31'
          type: object
          default: null
        locations:
          description: Locations
          properties:
            online:
              description: 'Online location'
              properties:
                enabled:
                  description: 'Enabled online location'
                  type: boolean
                  default: true
                  example: true
                warning_time:
                  description: "Warning time for online location in hours. It is the minimum time before the lesson that the student can book the lesson. If it is not set, the default value is the one set in the teacher's profile."
                  type: number
                  example: 2
              type: object
            home:
              description: 'Home location'
              properties:
                enabled:
                  description: 'Enabled home location'
                  type: boolean
                  default: false
                  example: false
                warning_time:
                  description: "Warning time for home location in hours. It is the minimum time before the lesson that the student can book the lesson. If it is not set, the default value is the one set in the teacher's profile."
                  type: number
                  example: 2
              type: object
            headquarter:
              description: 'Headquarter location'
              properties:
                enabled:
                  description: 'Enabled headquarter location'
                  type: boolean
                  default: false
                  example: false
                warning_time:
                  description: "Warning time for headquarter location in hours. It is the minimum time before the lesson that the student can book the lesson. If it is not set, the default value is the one set in the teacher's profile."
                  type: number
                  example: 2
              type: object
            home_from_headquarter:
              description: 'Home location from headquarter'
              properties:
                enabled:
                  description: 'Enabled home_from_headquarter location'
                  type: boolean
                  default: false
                  example: false
                warning_time:
                  description: "Warning time for home_from_headquarter location in hours. It is the minimum time before the lesson that the student can book the lesson. If it is not set, the default value is the one set in the teacher's profile."
                  type: number
                  example: 2
              type: object
          type: object
        only_consecutive_lessons:
          description: 'Only consecutive lessons are allowed. If it is set to true, the first lesson booked on the availability can be booked at any time, but the following lessons must be booked consecutively. It means that if for example the availability is from 15:00 to 18:00 and a lesson is booked from 15:00 to 16:00, next lesson can be booked only from 16:00. If it is set to false, the student can book any lesson at any time.'
