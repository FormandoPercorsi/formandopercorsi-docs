        - code
        - name
        - metric_type
        - result_type
      properties:
        code:
          description: 'Unique metric code'
          type: string
          example: events_total
        name:
          description: 'Human-readable metric name'
          type: string
          example: 'Total Events'
        description:
          description: 'Metric description'
          type: string
          example: 'Total number of tracked events'
          nullable: true
        metric_type:
          description: "Metric type: 'primitive' for basic aggregation on raw events, 'composite' for combining other metrics"
          type: string
          enum:
            - primitive
            - composite
          example: primitive
        primitive_type:
          description: 'Primitive aggregation operation (required if metric_type=primitive). Available types: count_events (count matching events), distinct_sessions (count unique sessions), distinct_users (count unique users), count_anonymous_events (events without user_id), count_authenticated_events (events with user_id), sum_numeric_field (sum field values), count_distinct_values (count unique field values), min_numeric_field (minimum field value), max_numeric_field (maximum field value)'
          type: string
          enum:
            - count_events
            - distinct_sessions
            - distinct_users
            - count_anonymous_events
            - count_authenticated_events
            - sum_numeric_field
            - count_distinct_values
            - min_numeric_field
            - max_numeric_field
          example: count_events
          nullable: true
        result_type:
          description: "Result data type: 'number' for numeric values, 'json' for complex objects"
          type: string
          enum:
            - number
            - json
          example: number
        parameters:
          description: 'Configuration parameters for metric calculation. For field-based operations (sum_numeric_field, count_distinct_values, min_numeric_field, max_numeric_field) must include: {"field": "path.to.field"} using dot notation (e.g., "payload.amount", "data.product_id"). Not required for simple count operations.'
          type: object
          example: '{"field": "payload.amount"}'
          nullable: true
        expression:
          description: "String expression for composite metrics using Symfony ExpressionLanguage syntax. Reference other metrics by their code (e.g., 'conversions / sessions * 100', 'percentage(metric_a, metric_b)', 'safe_divide(revenue, users, 0)'). Required for composite metrics."
          type: string
          example: 'percentage(lessons_completed, lessons_booked)'
          nullable: true
      type: object
