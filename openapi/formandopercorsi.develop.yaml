  -
    name: Auth
    description: "Authentication APIs provides the ability to authenticate a\n    user and get a JWT token, refresh the JWT token, request a password reset,\n    reset the password, signup a new user, confirm a family or admin user, and\n    signout. The JWT token is used to authenticate the user in the other APIs\n    and has exiration time of 10 min. In order to get a new JWT token after it\n    has expired, the user can use the refresh-token endpoint. The refresh token\n    is stored in an HttpOnly cookie that Javascript can never read and that's\n    limited by path. The refresh token is used to renew the JWT token without\n    the need to re-enter the credentials. The refresh token has an expiration\n    time of 24 hours. For more details see the [documentation of\n    Yii2](https://www.yiiframework.com/wiki/2568/jwt-authentication-tutorial)."
