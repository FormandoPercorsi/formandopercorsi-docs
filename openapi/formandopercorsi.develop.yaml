              description: 'The user ID of the provider'
              type: integer
              example: 12
          type: object
        client:
          description: 'Client informations. It contains the user ID of the client'
          properties:
            id:
              description: 'The user ID of the client. It is alternative to first_name and last_name or company_name'
              type: integer
              example: 12
