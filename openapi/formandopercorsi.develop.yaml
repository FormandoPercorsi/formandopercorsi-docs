                properties:
                  status: { type: string, example: ok }
                  data: { $ref: '#/components/schemas/SubtopicDto' }
                type: object
        '400':
          description: 'Validation error (e.g. duplicate name or non-existent topic)'
        '401':
          description: 'Missing or invalid JWT token'
        '403':
          description: 'User does not have admin privileges'
        '404':
          description: 'Subtopic not found'
      security:
        -
          bearerAuth: []
  '/api/subtopic/{id}/exercise':
    get:
      tags:
        - Subtopic
      summary: 'List exercises in a subtopic'
      description: 'Returns a paginated list of exercises belonging to a subtopic. Unauthenticated users see only public active exercises; authenticated users also see "registered" visibility. Admins see all exercises (including drafts and archived) and can filter by status and visibility.'
      operationId: dd4dc9ae471b86ac3afac1636c1544b8
      parameters:
        -
          name: id
          in: path
          description: 'Subtopic ID'
          required: true
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Page number (starting from 1)'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: page_size
          in: query
          description: 'Number of results per page'
          required: false
          schema:
            type: integer
            default: 10
        -
          name: sort_by
          in: query
          description: 'Field to sort results by'
          required: false
          schema:
            type: string
            default: sort_order
            enum:
              - sort_order
              - title
              - created_at
        -
          name: sort_order
          in: query
          description: 'Sort direction'
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
        -
          name: title
          in: query
          description: 'Filter by exercise title (partial match, case-insensitive)'
          required: false
          schema:
            type: string
        -
          name: status
          in: query
          description: 'Filter by exercise status (admin only). Values: active, draft, archived'
          required: false
          schema:
            type: string
            enum:
              - active
              - draft
              - archived
        -
          name: visibility
          in: query
          description: 'Filter by visibility level (admin only). Values: public, registered, premium'
          required: false
          schema:
            type: string
            enum:
              - public
              - registered
              - premium
        -
          name: resolve_images
          in: query
