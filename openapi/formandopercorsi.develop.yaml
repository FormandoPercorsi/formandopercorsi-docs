              description: Locations
              properties:
                online:
                  type: boolean
                  default: true
                  example: true
                home:
                  type: boolean
                  default: true
                  example: true
                home_from_headquarter:
                  type: boolean
                  default: true
                  example: true
                headquarter:
                  type: boolean
                  default: true
                  example: true
              type: object
            start_date:
              description: 'Start date. Deprecated - use start_date_time in BaseRecordSearchForm.'
              type: string
              format: date
              example: '2022-01-01'
