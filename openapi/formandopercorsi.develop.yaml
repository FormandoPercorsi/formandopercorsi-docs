    Invoice:
      title: Invoice
      description: 'Invoice object is used to represent an invoice. It is used to store some invoice data (not all but only needed to visualize) and to manage the invoice status.'
      properties:
        id:
          description: 'The invoice ID'
          type: integer
          example: 13
        provider:
